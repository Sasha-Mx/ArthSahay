<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArthSahay 24/7 | Tata Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #FFFBF0; /* Reverted to Warm Cream */
        color: #0F172A; /* Slate 900 */
      }
      
      /* Card Style - Clean, Flat, Bordered */
      .neo-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      /* Custom Range Slider Styling - Gold/Indigo Theme */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #D97706; /* Vedic Gold */
        border: 2px solid #FFFFFF;
        cursor: pointer;
        margin-top: -8px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        cursor: pointer;
        background: #E2E8F0;
        border-radius: 3px;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Scrollbar - Improved Visibility */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #94A3B8 transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #CBD5E1;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #94A3B8;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.6s ease-out forwards;
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 60s linear infinite;
      }

      /* Confetti Animation */
      @keyframes confetti-fall {
        0% {
          transform: translate(-50%, -50%) rotate(0deg) scale(var(--scale));
          opacity: 1;
        }
        100% {
          transform: translate(var(--x), var(--y)) rotate(720deg) scale(0);
          opacity: 0;
        }
      }

      .confetti-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 99; /* Below modals, above content */
      }

      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #f00; /* Default, overridden by inline style */
        animation: confetti-fall var(--duration) linear var(--delay) forwards;
        opacity: 0;
        border-radius: 50%; /* Make them round */
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#FFFBF0", // Warm Cream (Reverted)
              navy: "#0F172A", // Midnight Indigo
              teal: "#0D9488", // Deep Teal
              tealDark: "#115E59",
              orange: "#D97706", // Mapped to Vedic Gold
              orangeDark: "#B45309",
              gold: "#F59E0B",
              indigo: "#312E81",
              softGray: "#F1F5F9",
              // New Tata Theme Colors
              tataBlue: "#004C97",
              tataLightBlue: "#DCEEFF",
              neutralGray: "#EDEDED",
            },
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            }
          }
        }
      }
    </script>
